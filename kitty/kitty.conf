# ════════════════════════════════════════════════════════
#  Kitty — Sistema de Diseño Tron (Bando de los Usuarios)
# ════════════════════════════════════════════════════════

# ── Fuentes ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# ── Transparencia ────────────────────────────────────────
# background_opacity solo afecta el fondo, no el texto
background_opacity           0.85
dynamic_background_opacity   no

# ── Colores base (Tron) ──────────────────────────────────
background  #05050A
foreground  #FFFFFF

# Cursor — Cian Neón
cursor                #00F0FF
cursor_text_color     #0B132B
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# Selección
selection_background  #0066FF
selection_foreground  #FFFFFF

# URLs
url_color   #00F0FF
url_style   straight

# ── Paleta ANSI (16 colores Tron) ────────────────────────
# Negro
color0   #05050A
color8   #0B132B
# Rojo (errores)
color1   #FF3B3B
color9   #FF6E6E
# Verde → Cian Neón Tron
color2   #00C8D4
color10  #00F0FF
# Amarillo → Azul Eléctrico Tron
color3   #0055CC
color11  #0066FF
# Azul
color4   #003399
color12  #0066FF
# Magenta
color5   #6600CC
color13  #9933FF
# Cian
color6   #00C8D4
color14  #00F0FF
# Blanco
color7   #E2E8F0
color15  #FFFFFF

# ── Tab bar ──────────────────────────────────────────────
tab_bar_style                fade
tab_fade                     0.25 0.5 0.75 1
tab_bar_background           #05050A
tab_bar_margin_color         #05050A
active_tab_foreground        #00F0FF
active_tab_background        #0B132B
active_tab_font_style        bold
inactive_tab_foreground      #E2E8F0
inactive_tab_background      #05050A
inactive_tab_font_style      normal
tab_title_template           " {title} "

# ── Comportamiento ───────────────────────────────────────
enable_audio_bell      no
mouse_hide_wait        2.0
repaint_delay          8
input_delay            1
sync_to_monitor        yes
copy_on_select         no
strip_trailing_spaces  smart

# ── Ventana ──────────────────────────────────────────────
window_padding_width   8
placement_strategy     center
