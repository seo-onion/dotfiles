[default_apps]
teams = "teams-for-linux --enable-features=UseOzonePlatform --ozone-platform=wayland --url {meeting_url}"
calendar_client = "thunderbird"
terminal = "kitty"
browser = "firefox %u"

[units]
lengths = "meters"
weights = "kg"
volumes = "l"
temperatures = "C"
currency = "eur"

[debug]
try_suppress_errors = false
try_suppress_warnings = false
app_paths = []

[appearance]
width = 900
height = 593
margins = [0, 0, 0, 0]
anchor = ""
gsk_renderer = "cairo"
icon_paths = ["~/.config/sherlock/icons"]
icon_size = 22
use_base_css = true
use_system_theme = false
opacity = 1.0
mod_key_ascii = ["⇧", "⇧", "⌘", "⌘", "⎇", "✦", "✦", "⌘"]
# 0 = sin etiquetas de atajo; tambien desactiva su disparo (era Ctrl+numero,
# aunque la etiqueta pintaba el simbolo de Super)
num_shortcuts = 0
placeholder = "Search:"

[behavior]
use_xdg_data_dir_icons = false
animate = true
use_lr_nav = false
n_clicks = 2
remember_query = false

[binds]
up = "control-k"
down = "control-j"
left = "control-ih"
right = "control-l"
context = "control-i"
modifier = "control"
exec_inplace = "control-return"

[keybinds]
# Sherlock NO trae valores por defecto aqui: lo que no este en esta tabla,
# no hace nada. Sin esta linea, Enter no lanzaba la app.
"return" = "exec"

[files]
config = "/home/seo-onion/.config/sherlock/config.toml"
css = "/home/seo-onion/.config/sherlock/tron.css"
fallback = "/home/seo-onion/.config/sherlock/fallback.json"
alias = "/home/seo-onion/.config/sherlock/sherlock_alias.json"
ignore = "/home/seo-onion/.config/sherlock/sherlockignore"
actions = "/home/seo-onion/.config/sherlock/sherlock_actions.json"

[runtime]
multi = false
center = false
photo_mode = false
display_raw = false
daemonize = false

[caching]
enable = true
cache = "/home/seo-onion/.cache/sherlock/desktop_files.bin"

[expand]
enable = false
edge = "top"
margin = 0

[backdrop]
enable = false
opacity = 0.6
edge = "top"

[status_bar]
enable = false

[search_bar_icon]
enable = true
icon = "system-search-symbolic"
icon_back = "sherlock-back"
size = 22
