# Tema Tron para hyprlock — paleta de theme.md
# Se lanza desde power-panel.py (Bloquear). No hay hypridle: sin bloqueo automatico.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 4
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(05050af0)
    font_color = rgb(e2e8f0)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff4444ee)

    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##595959">contraseña</span>
    fail_text = <span foreground="##ff4444">incorrecta ($ATTEMPTS)</span>
    dots_size = 0.25
    dots_spacing = 0.3
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = rgb(e2e8f0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.utf8 date +"%A %d de %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(00f0ffcc)
    position = 0, 40
    halign = center
    valign = center
}
